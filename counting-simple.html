<!doctype html>
<html lang="te">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ఎన్నికల ఫలితాలు · AP Election Results</title>
  <meta name="description" content="2026 Andhra Pradesh urban local body results, town by town, with result images to share." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anek+Telugu:wght@400;600;800&family=Ramabhadra&family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="counting-simple.css?v=20261104200000" />
</head>
<body>
  <div id="demoBar" class="demo" hidden><b>డెమో · నిజమైన ఫలితాలు కావు</b><input id="demoP" type="range" min="0" max="100" value="60" aria-label="Counting stage" /><span id="demoV">60%</span><a href="counting-simple.html">Exit</a></div>
  <main class="wrap">
    <p class="crumb"><a href="./#/local">← పూర్తి వెబ్‌సైట్ · Full site</a> <button class="live-btn" id="state" type="button" aria-label="Refresh live results"><i></i><span id="stateT">LIVE</span></button></p>
    <h1>ఎన్నికల ఫలితాలు <small>2026 పుర ఎన్నికలు</small></h1>
    <form class="find" id="find" role="search" autocomplete="off"><input id="findQ" type="search" placeholder="నగరం వెతకండి · City" aria-label="Search city or town" /><button type="submit" aria-label="Search">🔍 వెతుకు</button><div class="find-list" id="findList" hidden></div></form>
    <nav class="tabs" role="tablist" aria-label="Result type">
      <button type="button" role="tab" data-tab="mayors">మేయర్లు <small>13</small></button>
      <button type="button" role="tab" data-tab="towns">మున్సిపాలిటీలు <small>87</small></button>
      <button type="button" role="tab" data-tab="insights">విశ్లేషణ <small>📊</small></button>
    </nav>

    <div class="cd" id="cd" hidden role="timer"></div>
    <p class="livebar" id="live" role="status"></p>

    <section id="tab-mayors" hidden>
      <div class="charts" id="chM"></div>
      <div class="chips"><button type="button" class="a4" data-share="img-a4-all">📄 అన్ని ఫలితాలు · A4</button><button type="button" data-share="img-overall">📷 మొత్తం</button><button type="button" data-share="img-mayors">📷 మేయర్లు</button><button type="button" data-share="img-mayor-votes">📊 ఓట్లు</button><button type="button" data-share="img-mayor-winners">🏆 విజేతలు</button></div>
      <p class="note" id="progM"></p>
      <p class="note uo" id="uoM"></p>
      <table class="res"><tbody id="may"></tbody></table>
    </section>

    <section id="tab-towns" hidden>
      <div class="charts" id="chT"></div>
      <div class="chips"><button type="button" class="a4" data-share="img-a4-all">📄 అన్ని ఫలితాలు · A4</button><button type="button" data-share="img-overall">📷 మొత్తం</button><button type="button" data-share="img-towns">📷 మున్సిపాలిటీలు</button><button type="button" data-share="img-chair-votes">📊 ఓట్లు</button><button type="button" data-share="img-chair-winners">🏆 విజేతలు</button></div>
      <p class="note" id="progT"></p>
      <p class="note uo" id="uoT"></p>
      <input id="q" type="search" placeholder="పట్టణం వెతకండి · Search town" aria-label="Search town" />
      <table class="res"><tbody id="all"></tbody></table>
    </section>

    <section id="tab-insights" hidden><div id="ins"></div></section>

  </main>

  <script src="data/bodies.js?v=20261103081429"></script>

  <script src="counting.js?v=20261107013000"></script>
  <script src="counting-simple.js?v=20261104140000"></script>
  <script src="data/general.js?v=20261103081429"></script>
  <script src="share-templates.js?v=20261103081429"></script>
  <script src="share-templates2.js?v=20261103081429"></script>
  <script src="share.js?v=20261103081429"></script>
  <script src="public-share.js?v=20261103081429"></script>
  <script src="counting-simple-images.js?v=20261103121355"></script>

  <script src="counting-simple-charts.js?v=20261104090000"></script>
  <script src="counting-simple-search.js?v=20261104120000"></script>
  <script src="counting-simple-a4.js?v=20261104160000"></script>
  <script src="data/rebels.js?v=20261104190000"></script>
  <script src="counting-simple-insights.js?v=20261104200000"></script>
  <script src="counting-simple-report.js?v=20261103121355"></script>
</body>
</html>

# Gram panchayat (Sarpanch) results on the three poll days (26 Nov, 29 Nov, 2 Dec): refresh live/gp.json from ETV Bharat's tracker
# every minute, no AI model, no database. Runs only in the public site repo. Counting starts at 2 PM IST (polling 7 AM to 1 PM) and
# runs late; each run loops ~57 minutes and starts the next one itself while it is still a poll day (until midnight IST).
name: live-gp
on:
  schedule:
    - cron: "7 0-18 26 11 *"
    - cron: "7 0-18 29 11 *"
    - cron: "7 0-18 2 12 *"
  workflow_dispatch:
    inputs:
      test:
        description: "Only save live/ping.txt once, to check that the job's saves reach the site"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: live-gp
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'vadarandom2-debug/apelectionresults-site'
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test save
        if: inputs.test
        run: |
          git config user.name "vadarandom2-debug"
          git config user.email "263738643+vadarandom2-debug@users.noreply.github.com"
          date -u +%FT%TZ > live/ping.txt && git add -f live/ping.txt && git commit -qm "Live ping" && git push -q origin HEAD:main
      - name: Check ETV every ~25 seconds for 57 minutes
        if: ${{ !inputs.test }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "vadarandom2-debug"
          git config user.email "263738643+vadarandom2-debug@users.noreply.github.com"
          end=$(( $(date +%s) + 3420 )); last=0; pending=0
          # GitHub Pages rebuilds the site on every push (about 30 s per build): read ETV every ~25 s and push when something changed,
          # at most every 75 s so a build is always finished before the next push (counting night 26 Nov: was 170 s)
          while [ "$(date +%s)" -lt "$end" ]; do
            if node .github/rural/live-gp.mjs ./logic.js | grep -q changed; then pending=1; fi
            if [ "$pending" = 1 ] && [ $(( $(date +%s) - last )) -ge 75 ]; then
              cp -r live /tmp/live-new
              git fetch -q origin main && git reset -q --hard origin/main   # a site publish may have replaced the history
              rm -rf live && cp -r /tmp/live-new live && rm -rf /tmp/live-new
              git add -f live
              if git commit -qm "Live panchayats $(date -u +%H:%MZ)"; then git push -q origin HEAD:main && last=$(date +%s); fi
              pending=0
            fi
            sleep 25
          done
      - name: Start the next run (GitHub's scheduler is not reliable)
        if: ${{ !inputs.test && always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # keep going all night: until 12:00 IST on 27 Nov (06:30 UTC); on later poll days until 04:30 IST the next morning
          now=$(date +%s); stop=$(date -u -d "2026-11-27 06:30:00" +%s)
          d=$(date -u +%m-%d); h=$(date -u +%H)
          if [ "$now" -lt "$stop" ]; then gh workflow run live-gp.yml --ref main
          else case "$d" in 11-29|12-02) if [ "$h" -lt 23 ]; then gh workflow run live-gp.yml --ref main; fi;; 11-30|12-03) if [ "$h" -lt 1 ]; then gh workflow run live-gp.yml --ref main; fi;; esac; fi
